<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Match – gecko-games</title>
<style>
*{box-sizing:border-box}html{background:#2b5fd9}
body{margin:0;min-height:100vh;color:#fff;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;gap:14px;padding:calc(28px + env(safe-area-inset-top,0px)) 14px calc(28px + env(safe-area-inset-bottom,0px));background:linear-gradient(160deg,#4f7cf0,#2b5fd9 50%,#1f3f9c)}
a.back{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:14px;color:#cfdcff;text-decoration:none;font-size:13px}
h1{margin:6px 0 0;font-size:clamp(28px,8vw,42px);text-shadow:0 3px 0 rgba(0,0,0,.25);letter-spacing:1px}
.stats{display:flex;gap:10px}.st{background:rgba(255,255,255,.18);border-radius:12px;padding:6px 16px;text-align:center;min-width:78px}
.st span{display:block;font-size:11px;letter-spacing:1px;color:#dbe6ff}.st b{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(400px,92vw)}
.card{aspect-ratio:3/4;perspective:700px;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.bk,.f{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.bk{background:radial-gradient(circle at 50% 50%,#ffd84d 0 12%,transparent 13%),repeating-linear-gradient(45deg,#e8483c 0 9px,#c9352b 9px 18px);border:4px solid #fff;font-size:0}
.card:hover:not(.flip) .in{transform:translateY(-4px)}
.f{background:#fff;transform:rotateY(180deg);font-size:clamp(34px,11vw,52px)}
.card.ok .f{background:#dcffe4;box-shadow:0 0 0 4px #4cd964,0 4px 0 rgba(0,0,0,.28)}
.card.ok .in{animation:hop .5s .45s}
@keyframes hop{40%{transform:rotateY(180deg) scale(1.12)}}
.btn{font:inherit;font-weight:700;font-size:16px;background:#ffd84d;color:#5a3d00;border:0;border-radius:24px;padding:10px 26px;cursor:pointer;box-shadow:0 4px 0 #c99c00}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #c99c00}
.modal{position:fixed;inset:0;background:rgba(10,20,60,.7);display:none;align-items:center;justify-content:center;z-index:9}
.modal.on{display:flex}
.mb{background:#fff;color:#243b7a;border-radius:20px;padding:26px 34px;text-align:center;animation:pp .4s}
.mb h2{margin:0 0 6px;font-size:30px}.mb p{margin:6px 0 16px;font-size:16px}
@keyframes pp{from{transform:scale(.6);opacity:0}}
</style><link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#090d16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="gecko-games">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));</script>
</head><body>
<a class='back' href='/'>← Back</a>
<h1>Memory Match</h1>
<div class="stats"><div class="st"><span>MOVES</span><b id="mv">0</b></div><div class="st"><span>TIME</span><b id="tm">0:00</b></div><div class="st"><span>BEST</span><b id="bs">-</b></div></div>
<div class="grid" id="g"></div>
<button class="btn" onclick="init()">New Game</button>
<div class="modal" id="m"><div class="mb"><h2>🎉 You did it!</h2><p id="mt"></p><button class="btn" onclick="init()">Play again</button></div></div>
<script>
const $=id=>document.getElementById(id);
const B=k=>{try{return+localStorage[k]||0}catch(e){return 0}},SB=(k,v)=>{try{localStorage[k]=v}catch(e){}};
const E=['🐶','🐱','🦊','🐼','🐸','🐵','🦁','🐙'];
let first,lock,mv,pairs,t0,tick,best=B('mem');
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function init(){clearInterval(tick);t0=0;first=null;lock=0;mv=0;pairs=0;$('m').className='modal';$('mv').textContent=0;$('tm').textContent='0:00';$('bs').textContent=best||'-';
 const a=[...E,...E].sort(()=>Math.random()-.5),g=$('g');g.innerHTML='';
 a.forEach(v=>{const c=document.createElement('div');c.className='card';c.dataset.v=v;c.innerHTML='<div class="in"><div class="bk"></div><div class="f">'+v+'</div></div>';c.onclick=()=>flip(c);g.appendChild(c)})}
function flip(c){if(lock||c.classList.contains('flip'))return;
 if(!t0){t0=Date.now();tick=setInterval(()=>$('tm').textContent=fmt(Math.floor((Date.now()-t0)/1000)),500)}
 c.classList.add('flip');if(!first){first=c;return}
 mv++;$('mv').textContent=mv;const f=first;first=null;
 if(f.dataset.v==c.dataset.v){f.classList.add('ok');c.classList.add('ok');if(++pairs==8)win()}
 else{lock=1;setTimeout(()=>{f.classList.remove('flip');c.classList.remove('flip');lock=0},800)}}
function win(){clearInterval(tick);const s=Math.floor((Date.now()-t0)/1000);if(!best||mv<best){best=mv;SB('mem',mv)}$('bs').textContent=best;
 setTimeout(()=>{$('mt').textContent=mv+' moves in '+fmt(s);$('m').className='modal on'},900)}
init();
</script></body></html>
