<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky Hop – gecko-games</title>
<style>
*{box-sizing:border-box}html{background:#4ec0ca}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff;font-family:"Arial Black",Arial,sans-serif;padding:calc(14px + env(safe-area-inset-top,0px)) 10px calc(14px + env(safe-area-inset-bottom,0px));background:#4ec0ca}
a.back{align-self:flex-start;color:#fff;text-decoration:none;font:700 13px Arial;opacity:.9}
canvas{width:min(92vw,calc(80vh*.5625));height:auto;aspect-ratio:288/512;border:4px solid #543847;border-radius:6px;touch-action:none;display:block;cursor:pointer}
.hint{font:13px Arial;text-align:center;opacity:.95}
</style><link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#090d16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="gecko-games">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));</script>
</head><body>
<a class='back' href='/'>← Back</a>
<canvas id="cv" width="288" height="512"></canvas>
<div class="hint">Click, tap or press Space to flap. Slip through the pipes.</div>
<script>
const rnd=n=>Math.floor(Math.random()*n),$=id=>document.getElementById(id);
const B=k=>{try{return+localStorage[k]||0}catch(e){return 0}},SB=(k,v)=>{try{localStorage[k]=v}catch(e){}};
const cv=$('cv'),c=cv.getContext('2d'),W=288,H=512,GY=432,BX=70,OL='#543847';
let st,y,v,p,sc,f=0,gx=0,flash=0,dt=0,best=B('hop');
const sk=[];for(let i=0;i<19;i++)sk.push([i*16,GY-14-rnd(48),8+rnd(9)]);
function reset(){st=0;y=230;v=0;p=[];sc=0;flash=0}
function spawn(){p.push({x:W+30,g:120+rnd(GY-240),s:0})}
function flap(){if(st==0){st=1;spawn()}if(st==1)v=-5.6;else if(st==3&&Date.now()-dt>400)reset()}
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
addEventListener('keydown',e=>{if(e.key==' '||e.key=='ArrowUp'){e.preventDefault();flap()}});
function die(){if(st==2||st==3)return;st=2;flash=1;v=Math.max(v,0);if(sc>best){best=sc;SB('hop',sc)}}
function tick(){f++;
 if(st<2)gx=(gx+2.2)%24;
 if(st==0)y=230+Math.sin(f/8)*6;
 if(st==1){v+=.34;y+=v;if(y<12){y=12;v=0}
  p.forEach(o=>{o.x-=2.2;if(!o.s&&o.x+52<BX-12){o.s=1;sc++}
   if(BX+11>o.x&&BX-11<o.x+52&&(y-9<o.g-56||y+9>o.g+56))die()});
  if(p[p.length-1].x<W-158)spawn();p=p.filter(o=>o.x>-60);
  if(y+12>=GY){y=GY-12;die();st=3;dt=Date.now()}}
 else if(st==2){v+=.5;y+=v;if(y+12>=GY){y=GY-12;st=3;dt=Date.now()}}
 draw();requestAnimationFrame(tick)}
function txt(s,x,y,sz,col,al){c.font='bold '+sz+'px "Arial Black",Arial';c.textAlign=al||'center';c.lineWidth=sz/6;c.strokeStyle=OL;c.lineJoin='round';c.strokeText(s,x,y);c.fillStyle=col||'#fff';c.fillText(s,x,y)}
function pipe(o){const t=o.g-56,b=o.g+56;
 [[0,t,t-24],[b,GY,b]].forEach(([a,z,cap])=>{
  c.fillStyle='#73bf2e';c.fillRect(o.x+2,a,48,z-a);c.fillStyle='#9be04a';c.fillRect(o.x+6,a,6,z-a);c.fillStyle='#558022';c.fillRect(o.x+40,a,8,z-a);
  c.strokeStyle=OL;c.lineWidth=2;c.strokeRect(o.x+2,a,48,z-a);
  c.fillStyle='#73bf2e';c.fillRect(o.x-2,cap,56,24);c.fillStyle='#9be04a';c.fillRect(o.x+2,cap,6,24);c.fillStyle='#558022';c.fillRect(o.x+44,cap,8,24);c.strokeRect(o.x-2,cap,56,24)})}
function bird(){c.save();c.translate(BX,y);c.rotate(st>=2?1.4:st==0?0:Math.max(-.45,Math.min(1.3,v*.09)));
 c.lineWidth=2;c.strokeStyle=OL;
 c.fillStyle='#f8d030';c.beginPath();c.ellipse(0,0,17,12,0,0,7);c.fill();c.stroke();
 c.fillStyle='#fbe98a';c.beginPath();c.ellipse(-2,5,10,5,0,0,7);c.fill();
 const w=st==2||st==3?4:Math.sin(f/2)*4;c.fillStyle='#fff';c.beginPath();c.ellipse(-7,2+w/2,8,5,-.3,0,7);c.fill();c.stroke();
 c.fillStyle='#fff';c.beginPath();c.arc(7,-5,5.5,0,7);c.fill();c.stroke();c.fillStyle='#000';c.beginPath();c.arc(9,-5,2.2,0,7);c.fill();
 c.fillStyle='#f75c2f';c.beginPath();c.ellipse(14,3,7,3.2,0,0,7);c.fill();c.stroke();c.fillStyle='#f58a4b';c.beginPath();c.ellipse(13,8,6,3,0,0,7);c.fill();c.stroke();
 c.restore()}
function draw(){
 c.fillStyle='#70c5ce';c.fillRect(0,0,W,H);
 c.fillStyle='#fff';[[40,70,1],[170,120,.8],[250,50,1.2],[100,200,.7]].forEach(([x,yy,s])=>{const X=((x-f*.25*s)%(W+120)+W+120)%(W+120)-60;[[0,0,16],[16,4,12],[-16,5,11],[6,-8,11]].forEach(([a,b,r])=>{c.beginPath();c.arc(X+a*s,yy+b*s,r*s,0,7);c.fill()})});
 c.fillStyle='#a8e0c0';sk.forEach(([x,yy,w])=>c.fillRect(x,yy,16,GY-yy));c.fillStyle='#8fd6a8';sk.forEach(([x,yy])=>c.fillRect(x,yy,3,GY-yy));
 c.fillStyle='#5ec460';for(let i=0;i<9;i++){c.beginPath();c.arc(i*40+10,GY,22+(i%3)*6,Math.PI,0);c.fill()}
 p.forEach(pipe);
 c.fillStyle='#ded895';c.fillRect(0,GY,W,H-GY);
 c.fillStyle='#73bf2e';c.fillRect(0,GY,W,14);c.fillStyle='#9be04a';for(let x=-24-gx;x<W;x+=24){c.beginPath();c.moveTo(x,GY);c.lineTo(x+12,GY);c.lineTo(x+2,GY+14);c.lineTo(x-10,GY+14);c.fill()}
 c.fillStyle='#558022';c.fillRect(0,GY+14,W,3);c.fillStyle=OL;c.fillRect(0,GY-2,W,2);c.fillStyle='#d0c874';c.fillRect(0,GY+17,W,4);
 bird();
 if(st==1||st==2)txt(sc,W/2,80,44);
 if(st==0){txt('Get Ready!',W/2,160,30,'#fc7a2a');txt('TAP',W/2,300,26,'#fff');c.fillStyle='rgba(255,255,255,.9)';c.beginPath();c.arc(W/2,330,9,0,7);c.fill();c.stroke()}
 if(st==3){txt('GAME OVER',W/2,150,32,'#fc7a2a');
  c.fillStyle='#ded895';c.strokeStyle=OL;c.lineWidth=4;c.beginPath();c.roundRect(44,180,200,110,8);c.fill();c.stroke();
  c.font='bold 12px Arial';c.fillStyle='#fc7a2a';c.textAlign='left';c.fillText('MEDAL',60,204);c.textAlign='right';c.fillText('SCORE',228,204);c.fillText('BEST',228,250);
  txt(sc,228,232,22,'#fff','right');txt(best,228,278,22,'#fff','right');
  const m=sc>=30?['#f5d142','#c99a10']:sc>=20?['#d8dde3','#98a0aa']:sc>=10?['#cd7f32','#8a5216']:null;
  c.fillStyle=m?m[0]:'#c8bd80';c.strokeStyle=m?m[1]:'#b5aa6a';c.lineWidth=4;c.beginPath();c.arc(84,248,22,0,7);c.fill();c.stroke();
  if(Date.now()-dt>400)txt('TAP TO RETRY',W/2,345,20,'#fff')}
 if(flash>0){c.fillStyle='rgba(255,255,255,'+flash+')';c.fillRect(0,0,W,H);flash=Math.max(0,flash-.06)}}
reset();tick();
</script></body></html>
